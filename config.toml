[pubmed]
# Search expression for the electrochem sensor / biosensor area (design 5).
query = "(ion-selective electrode[Title/Abstract]) OR (ionophore[Title/Abstract]) OR (pH sensor[Title/Abstract]) OR (potentiometric[Title/Abstract]) OR (electrochemical sensor[Title/Abstract]) OR (electrochemical biosensor[Title/Abstract])"
