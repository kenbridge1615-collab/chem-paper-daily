# Chem Paper Daily configuration.
# Journals, keywords, genre ratio, notification time, and proxy URL format can
# all be adjusted here (requirements R2-5). Secrets live in .env, never here.

[general]
# Contact email sent to Crossref / Unpaywall so requests use the polite pool.
# Replace with your own address.
contact_email = "you@example.com"
# Time the daily job is scheduled to notify (24h, local time). Default 07:00.
notify_time = "07:00"
# How many days back each source is queried for new papers.
lookback_days = 3

[genre]
# Genre ratio (requirements R2-2). electrochem ~40% / other ~60%.
# The daily job corrects drift by comparing against the last 10 days of actuals.
electrochem = 0.4
other = 0.6
# Window (days) used when measuring the recent genre balance.
balance_window_days = 10

[limits]
# Maximum introductions generated per day (requirements R2-4). The automatic
# daily pick plus manual "one more" picks count toward this.
max_intros_per_day = 3

[llm]
# Generation backend: "claude_code" (default, uses the subscribed Claude plan
# via `claude -p`, no extra cost) or "api" (metered Anthropic API).
backend = "claude_code"
# Model passed to the backend. Sonnet-class by default.
model = "claude-sonnet-4-5"
# Timeout in seconds for a single generation call.
timeout_seconds = 180
# Max retries after a transient failure (not applied to "not logged in" or
# "usage limit" failures).
max_retries = 2

[fulltext]
# Tohoku University off-campus (proxy) access URL template. {doi} is filled in.
# Confirm the real proxy host during setup; on-campus the plain DOI link works.
proxy_url_template = "https://www.library.tohoku.ac.jp/openurl?doi={doi}"

[scoring]
# Journal rank points: top-tier 3, specialist 2, everything else 1.
journal_weight_top = 3
journal_weight_specialist = 2
journal_weight_other = 1
# Feedback bonus: a thumbs-up on a paper adds this to papers sharing its
# journal or a matching keyword; a thumbs-down subtracts it.
feedback_bonus = 1

# Keyword weights applied when the term appears in the title or abstract.
[scoring.keywords]
electrochemical = 2
electrode = 1
ionophore = 2
"ion-selective" = 2
"pH sensor" = 2
potentiometric = 2
voltammetry = 1
battery = 1
electrocatalysis = 1
biosensor = 1
sensor = 1

# Terms that classify a paper as the electrochem genre (design section 6).
[genre.electrochem_keywords]
terms = [
    "electrochemical",
    "electrode",
    "ionophore",
    "ion-selective",
    "pH sensor",
    "potentiometric",
    "voltammetry",
    "battery",
    "electrocatalysis",
]

